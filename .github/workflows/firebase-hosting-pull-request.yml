# Firebase Hosting — Preview otomatis untuk tiap Pull Request (opsional)
# Jika tidak mau memakai fitur ini, file ini boleh dihapus.

name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SNH2 }}'
          projectId: REPLACE_WITH_YOUR_FIREBASE_PROJECT_ID