# Firebase Hosting — Deploy otomatis saat push / merge ke branch main
# Lihat README.md bagian "Deploy ke Firebase" untuk cara mengisi projectId & secret.

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SNH2 }}'
          channelId: live
          projectId: REPLACE_WITH_YOUR_FIREBASE_PROJECT_ID